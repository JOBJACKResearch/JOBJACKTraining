<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOBJACK | Assessment Interpretation Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --teal:#004846;
  --green-mid:#006c51;
  --green-sec:#59b367;
  --lime:#b9f400;
  --navy:#0a2139;
  --muted:#6b7684;
  --border:#e1e6e2;
  --bg:#f5f7f6;
  --white:#ffffff;
  --pale-green:#eaf7ee;
  --pale-lime:#f7ffdc;
  --danger:#c23b3b;
  --danger-bg:#fdecec;
  --gold:#e8ab1d;
  --blue-ipc:#2957b0;
  --blue-ipc-bg:#eef2fb;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--navy);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
button{font-family:inherit;}

/* ============ SHELL LAYOUT ============ */
.shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:var(--teal);
  color:#fff;
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.topbar-left{display:flex;align-items:center;gap:16px;}
.logo-chip{background:#fff;padding:6px 12px;border-radius:8px;display:flex;align-items:center;}
.logo-chip img{height:20px;}
.topbar-title{
  font-size:14px;
  font-weight:500;
  color:rgba(255,255,255,.85);
  border-left:1px solid rgba(255,255,255,.25);
  padding-left:16px;
}
.topbar-title strong{color:#fff;font-weight:600;}
.overall-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.8);min-width:170px;}
.overall-track{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;}
.overall-fill{height:100%;background:var(--lime);border-radius:10px;transition:width .4s ease;}

.layout{
  flex:1;
  display:flex;
  max-width:1280px;
  margin:0 auto;
  width:100%;
  gap:28px;
  padding:32px 24px 90px;
  align-items:flex-start;
}

/* ============ SIDEBAR / STEPPER ============ */
.sidebar{width:264px;flex-shrink:0;}
.sidebar-inner{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px;
  position:sticky;
  top:96px;
}
.step-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px 13px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:4px;
  transition:background .15s ease;
}
.step-item:hover{background:var(--pale-green);}
.step-item.locked{cursor:not-allowed;opacity:.5;}
.step-item.locked:hover{background:transparent;}
.step-item.active{background:var(--pale-green);}
.step-badge{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:#eef1f0;color:var(--muted);margin-top:2px;
}
.step-item.active .step-badge{background:var(--teal);color:#fff;}
.step-item.done .step-badge{background:var(--green-sec);color:#fff;}
.step-text{font-size:13.5px;font-weight:500;color:var(--navy);line-height:1.4;}
.step-item.locked .step-text{color:var(--muted);}
.step-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}

/* ============ MAIN CONTENT ============ */
.main{flex:1;min-width:0;}
.card-panel{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  padding:46px 48px 54px;
}
.section-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--green-mid);background:var(--pale-green);padding:6px 13px;border-radius:100px;
  margin-bottom:16px;
}
.section-title{font-size:29px;font-weight:700;margin:0 0 14px;color:var(--navy);line-height:1.3;}
.section-lead{font-size:15px;line-height:1.75;color:var(--muted);max-width:760px;margin:0 0 8px;}

h3.block-title{font-size:16.5px;font-weight:700;margin:42px 0 14px;color:var(--teal);line-height:1.4;}
h3.block-title:first-of-type{margin-top:30px;}
h4.mini-title{font-size:14px;font-weight:700;margin:0 0 8px;color:var(--navy);}
p.body-text{font-size:14.5px;line-height:1.8;color:#31404a;margin:0 0 14px;}
p.body-text:last-child{margin-bottom:0;}

.grid{display:grid;gap:16px;margin:0;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}}

.tile{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px 18px;}
.tile h4{margin:0 0 6px;font-size:13.5px;font-weight:700;line-height:1.4;color:var(--navy);}
.tile p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);}

.callout{background:var(--teal);color:#fff;border-radius:14px;padding:24px 26px;margin:0;}
.callout h4{margin:0 0 10px;font-size:14.5px;font-weight:700;color:var(--lime);line-height:1.4;}
.callout p{font-size:13.5px;line-height:1.75;color:rgba(255,255,255,.92);margin:0 0 10px;}
.callout p:last-child{margin-bottom:0;}
.callout ul{margin:8px 0 0;padding-left:18px;}
.callout li{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.92);margin-bottom:6px;}
.callout-light{background:var(--pale-green);border:1px solid #cfe9d6;border-radius:14px;padding:22px 24px;margin:0;}
.callout-light h4{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--teal);line-height:1.4;}
.callout-light p{font-size:13.5px;line-height:1.75;color:#284238;margin:0 0 8px;}

.screenshot-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;margin:22px -48px 26px;}
@media (max-width:880px){.screenshot-card{margin-left:-22px;margin-right:-22px;}}
.screenshot-card img{max-width:100%;width:auto;height:auto;display:block;margin:0 auto;border-radius:8px;border:1px solid var(--border);}
/* ---- Section 5: Assessment & Checks Hub walkthrough ---- */
.hub-shot{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;margin:18px auto 8px;}
.zoom-badge{position:absolute;right:26px;bottom:26px;background:rgba(10,33,57,.88);color:#fff;font-size:11.5px;font-weight:600;padding:6px 13px;border-radius:100px;pointer-events:none;}
.hub-shot.narrow{max-width:820px;}
.hub-shot.wide{margin-left:-48px;margin-right:-48px;}
@media (max-width:880px){.hub-shot.wide{margin-left:-22px;margin-right:-22px;}}
.hub-shot img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;}
.hub-caption{font-size:12px;color:#6b7684;text-align:center;margin:0 0 24px;line-height:1.5;}
.col-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--navy);border:1.5px solid var(--teal);font-size:11.5px;font-weight:700;margin-right:8px;vertical-align:middle;}
.hub-table td:first-child{width:215px;white-space:nowrap;}
.lightbox{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(10,33,57,.95);display:none;z-index:10000;overflow:auto;}
.lightbox.open{display:block;}
.lightbox-stage{padding:68px 24px 52px;min-height:100%;box-sizing:border-box;}
.lightbox img{display:block;margin:0 auto;max-width:96vw;max-height:calc(100vh - 128px);width:auto;height:auto;border-radius:8px;background:#fff;box-shadow:0 12px 44px rgba(0,0,0,.5);cursor:zoom-in;}
.lightbox.actual img{max-width:none;max-height:none;cursor:zoom-out;}
.lightbox-bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;background:rgba(10,33,57,.97);z-index:2;}
.lightbox-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:100px;margin-left:10px;cursor:pointer;}
.lightbox-btn:hover{background:rgba(255,255,255,.24);}
.lightbox-hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#cfe3de;font-size:12px;pointer-events:none;}
.screenshot-caption{font-size:12px;color:#6b7684;text-align:center;margin-top:12px;line-height:1.5;}
.portal-step-label{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);margin:32px 0 10px;}

.numbered-list{margin:0;padding-left:0;list-style:none;counter-reset:num;}
.numbered-list li{counter-increment:num;position:relative;padding-left:34px;margin-bottom:12px;font-size:13.5px;line-height:1.7;}
.numbered-list li:last-child{margin-bottom:0;}
.numbered-list li::before{
  content:counter(num);position:absolute;left:0;top:0;width:22px;height:22px;
  background:var(--lime);color:var(--teal);font-weight:700;font-size:11.5px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

.icon-row{display:flex;gap:20px;flex-wrap:wrap;margin:0;}
.icon-row .icon-item{flex:1;min-width:140px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:20px 12px;}
.icon-row .icon-item span{font-size:13px;font-weight:600;}

.stat-trio{display:flex;gap:16px;flex-wrap:wrap;margin:0;}
.stat-trio .stat{flex:1;min-width:170px;background:var(--teal);color:#fff;border-radius:12px;padding:18px 18px;text-align:left;}
.stat-trio .stat b{display:block;font-size:13.5px;color:var(--lime);margin-bottom:6px;line-height:1.4;}
.stat-trio .stat span{display:block;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.85);}

.accordion{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:0;}
.acc-item{border-bottom:1px solid var(--border);}
.acc-item:last-child{border-bottom:none;}
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;cursor:pointer;background:#fff;transition:background .15s;}
.acc-head:hover{background:var(--pale-green);}
.acc-head-left{display:flex;align-items:center;gap:12px;}
.acc-num{width:28px;height:28px;border-radius:8px;background:var(--pale-green);color:var(--teal);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.acc-head-title{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.4;}
.acc-head-tag{font-size:11px;color:var(--muted);margin-top:2px;}
.acc-chevron{transition:transform .2s ease;color:#fff;font-size:13px;background:var(--teal);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.acc-item.open .acc-chevron{transform:rotate(180deg);background:var(--green-mid);}
.acc-body{max-height:0;overflow:hidden;transition:max-height .25s ease;background:#fbfdfc;}
.acc-item.open .acc-body{max-height:4000px;}
.acc-body-inner{padding:8px 22px 26px 22px;}
.output-pill{display:inline-block;font-size:11px;font-weight:600;padding:5px 11px;border-radius:100px;background:var(--pale-lime);color:#5c6b00;margin-bottom:14px;line-height:1.5;}
.direction-pill{display:inline-block;font-size:11px;font-weight:600;padding:5px 11px;border-radius:100px;background:var(--blue-ipc-bg);color:var(--blue-ipc);margin-bottom:14px;line-height:1.5;margin-left:8px;}
.construct-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px;}
@media (max-width:700px){.construct-grid{grid-template-columns:1fr;}}
.construct-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;}
.construct-box b{display:block;font-size:12.5px;color:var(--teal);margin-bottom:3px;line-height:1.35;}
.construct-box span{font-size:12px;line-height:1.45;color:var(--muted);}
.subgroup-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--green-mid);margin:20px 0 10px;}

.dev-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.dev-item:last-child{margin-bottom:0;}
.dev-item b{display:block;font-size:13px;color:var(--teal);margin-bottom:8px;}
.dev-item ul{margin:0;padding-left:18px;}
.dev-item li{font-size:12.5px;line-height:1.65;color:#31404a;margin-bottom:5px;}
.dev-item li:last-child{margin-bottom:0;}

.scale-track{display:flex;border-radius:10px;overflow:hidden;height:48px;margin:14px 0 6px;}
.scale-seg{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;position:relative;}
.seg-below{background:#c9d6d3;color:#48605a;}
.seg-avg{background:var(--green-sec);}
.seg-above{background:var(--teal);}
.seg-poor{background:#d9534f;}
.seg-average{background:#e7b13a;}
.seg-good{background:var(--green-sec);}
.seg-excellent{background:var(--teal);}
.scale-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;}


.sten-row{display:flex;align-items:center;gap:14px;margin:0 0 18px;}
.sten-row:last-child{margin-bottom:0;}
.sten-label{width:190px;flex-shrink:0;font-size:12.5px;font-weight:600;line-height:1.45;}
.sten-scale{display:flex;gap:4px;flex:1;}
.sten-cell{flex:1;height:34px;border-radius:6px;background:#eef1f0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);position:relative;}
.sten-cell.ideal{background:var(--blue-ipc-bg);border-color:#b7cdf7;color:var(--blue-ipc);font-weight:700;}
.sten-cell.applicant{background:var(--teal);color:#fff;font-weight:700;}
.sten-cell.applicant.ideal{background:var(--teal);}
.sten-legend{display:flex;gap:18px;font-size:11.5px;color:var(--muted);margin-top:2px;}
.sten-legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
.dot-app{background:var(--teal);}
.dot-ideal{background:var(--blue-ipc-bg);border:1px solid #b7cdf7;}

.compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0;}
@media (max-width:800px){.compare-cols{grid-template-columns:1fr;}}
.compare-col{border:1px solid var(--border);border-radius:14px;padding:20px;background:var(--bg);}
.compare-col.b{background:var(--blue-ipc-bg);border-color:#d3ddf5;}
.compare-col h4{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--teal);line-height:1.4;}
.compare-col.b h4{color:var(--blue-ipc);}
.compare-col ul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#31404a;}
.compare-col li{margin-bottom:6px;}
.compare-col li:last-child{margin-bottom:0;}
.compare-col p{font-size:13px;line-height:1.7;color:#31404a;margin:0 0 8px;}

.view-block{border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin:0;background:#fff;}
.view-block .view-badge{display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:100px;margin-bottom:10px;}
.view-block.v1 .view-badge{background:var(--pale-lime);color:#5c6b00;}
.view-block.v2 .view-badge{background:var(--blue-ipc-bg);color:var(--blue-ipc);}
.view-block h4{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--navy);}
.view-block p.sub{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.7;}

.profile-mock{border:1px solid var(--border);border-radius:14px;padding:20px;background:var(--bg);margin:12px 0 0;}
.profile-mock .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.profile-mock .row:last-child{margin-bottom:0;}
@media (max-width:700px){.profile-mock .row{grid-template-columns:1fr;}}
.mini-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;}
.mini-card h5{margin:0 0 10px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.mini-card .big{font-size:20px;font-weight:700;color:var(--teal);}
.tick{color:var(--green-mid);font-weight:700;}
.cross{color:var(--danger);font-weight:700;}
.confidential-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--danger);background:var(--danger-bg);padding:3px 9px;border-radius:100px;}
.view-details-link{color:var(--teal);font-weight:600;text-decoration:underline;font-size:12px;white-space:nowrap;}

.ipc-header-mock{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.ipc-avatar{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;}
.ipc-score-badge{background:var(--teal);color:#fff;border-radius:10px;padding:14px 20px;text-align:center;min-width:100px;}
.ipc-score-badge .num{font-size:24px;font-weight:700;color:var(--lime);}
.ipc-score-badge .lbl{font-size:11px;color:rgba(255,255,255,.85);}
.ipc-fit-scale{display:flex;gap:8px;margin:14px 0;}
.ipc-fit-scale .grp{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:11px;position:relative;}
.ipc-fit-scale .grp.selected{background:var(--blue-ipc-bg);border-color:#b7cdf7;color:var(--blue-ipc);font-weight:700;}
.ipc-fit-scale .grp b{display:block;font-size:12px;margin-bottom:2px;}
.ipc-fit-scale .grp .marker{width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block;margin-top:4px;}

.report-mock{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:12px 0 0;}
.report-mock .rmeta{font-size:12px;color:var(--muted);margin-bottom:12px;}
.report-mock .rmeta b{color:var(--navy);}
.report-mock h5{font-size:13px;font-weight:700;color:var(--teal);margin:14px 0 6px;}
.report-mock h5:first-of-type{margin-top:0;}
.report-mock p{font-size:12.5px;line-height:1.65;color:#31404a;margin:0 0 4px;}

.jv-tabs{display:flex;gap:6px;margin:16px 0 22px;border-bottom:2px solid var(--border);}
.jv-tab-btn{background:none;border:none;padding:12px 18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0;}
.jv-tab-btn:hover{color:var(--teal);background:var(--pale-green);}
.jv-tab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
.jv-tab-panel{display:none;}
.jv-tab-panel.active{display:block;}
.direction-table td.dir-high{color:var(--green-mid);font-weight:700;}
.direction-table td.dir-low{color:var(--blue-ipc);font-weight:700;}

.tip-list{margin:0;padding:0;list-style:none;}
.tip-list li{display:flex;gap:12px;font-size:13.5px;line-height:1.7;color:#31404a;margin-bottom:12px;}
.tip-list li:last-child{margin-bottom:0;}
.tip-list li > .tl-text{flex:1;min-width:0;}
.tip-list .tnum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--pale-green);color:var(--teal);font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:1px;}

/* iceberg graphic */
.iceberg-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:18px;margin:0;}
.iceberg-svg{width:100%;height:auto;display:block;border-radius:10px;background:#fff;}
.iceberg-legend{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
@media (max-width:600px){.iceberg-legend{grid-template-columns:1fr;}}
.iceberg-col{border-radius:10px;padding:18px 18px;}
.iceberg-col.above{background:#fff;border:1px solid var(--border);}
.iceberg-col.below{background:var(--teal);}
.iceberg-col b{display:block;font-size:13.5px;font-weight:700;margin:0 0 6px;line-height:1.4;}
.iceberg-col.above b{color:var(--teal);}
.iceberg-col.below b{color:var(--lime);}
.iceberg-col span{display:block;margin:0;font-size:12.5px;line-height:1.6;}
.iceberg-col.above span{color:var(--muted);}
.iceberg-col.below span{color:rgba(255,255,255,.85);}

/* ============ QUIZ ============ */
.quiz-wrap{margin-top:42px;border-top:2px dashed var(--border);padding-top:30px;}
.quiz-intro{background:var(--pale-green);border-radius:14px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;}
.quiz-intro h4{margin:0 0 6px;font-size:15px;color:var(--teal);line-height:1.4;}
.quiz-intro p{margin:0;font-size:12.5px;line-height:1.6;color:#284238;}
.btn{border:none;border-radius:9px;padding:12px 22px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .1s ease, opacity .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:#053f3d;}
.btn-lime{background:var(--lime);color:var(--teal);}
.btn-lime:hover{opacity:.88;}
.btn-outline{background:transparent;border:1.5px solid var(--teal);color:var(--teal);}
.btn-outline:hover{background:var(--pale-green);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.quiz-q{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:14px;}
.quiz-q .qhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;}
.qnum-badge{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qtext{font-size:14px;font-weight:600;color:var(--navy);line-height:1.5;}
.opt-label{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;margin-bottom:9px;cursor:pointer;font-size:13px;line-height:1.55;color:#31404a;transition:border-color .15s, background .15s;}
.opt-label:last-child{margin-bottom:0;}
.opt-label:hover{border-color:var(--green-sec);}
.opt-label input{margin-top:3px;accent-color:var(--teal);}
.opt-label.correct-mark{border-color:var(--green-sec);background:var(--pale-green);}
.opt-label.wrong-mark{border-color:var(--danger);background:var(--danger-bg);}
.opt-label.picked{border-color:var(--teal);background:#eef7f4;}

.quiz-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
.result-banner{border-radius:14px;padding:20px 22px;margin:18px 0;display:flex;align-items:center;gap:16px;}
.result-banner.pass{background:var(--pale-green);border:1px solid #cfe9d6;}
.result-banner.fail{background:var(--danger-bg);border:1px solid #f6cccc;}
.result-badge{flex-shrink:0;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;}
.result-banner.pass .result-badge{background:var(--green-sec);}
.result-banner.fail .result-badge{background:var(--danger);}
.result-banner h4{margin:0 0 4px;font-size:15.5px;line-height:1.4;}
.result-banner.pass h4{color:var(--teal);}
.result-banner.fail h4{color:var(--danger);}
.result-banner p{margin:0;font-size:13px;line-height:1.6;color:#40474f;}

.nav-footer{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:26px;border-top:1px solid var(--border);}
.locked-note{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}

/* cover page */
.cover-hero{background:linear-gradient(135deg,var(--teal),#03302e);color:#fff;border-radius:18px;padding:44px 44px 40px;margin-bottom:0;text-align:center;}
.cover-logo-chip{background:#fff;display:inline-flex;padding:9px 18px;border-radius:10px;margin-bottom:22px;}
.cover-logo-chip img{height:18px;display:block;}
.cover-hero h1{margin:0 0 14px;font-size:29px;color:#fff;line-height:1.35;}
.cover-hero p{margin:0 auto;max-width:520px;font-size:14.5px;line-height:1.75;color:rgba(255,255,255,.85);}
.cover-meta{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap;}
.cover-pill{background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:100px;}
.agenda-row{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--border);}
.agenda-row:last-child{border-bottom:none;}
.agenda-num{width:30px;height:30px;border-radius:9px;background:var(--pale-green);color:var(--teal);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.agenda-text b{display:block;font-size:14px;color:var(--navy);}
.agenda-text span{font-size:12.5px;color:var(--muted);}
.cover-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px;}
.cover-lock-note{font-size:12px;color:var(--muted);text-align:center;max-width:420px;}

/* finale + certificate */
.finale-hero{background:linear-gradient(135deg,var(--teal),#03302e);color:#fff;border-radius:16px;padding:38px 34px;margin-bottom:0;text-align:center;}
.finale-hero h2{margin:0 0 10px;font-size:24px;color:#fff;line-height:1.4;}
.finale-hero p{margin:0;color:rgba(255,255,255,.85);font-size:13.5px;line-height:1.6;}
.recap-row{display:flex;gap:12px;flex-wrap:wrap;margin:0;}
.recap-chip{flex:1;min-width:150px;background:var(--pale-green);border:1px solid #cfe9d6;border-radius:10px;padding:14px 16px;font-size:12.5px;font-weight:600;color:var(--teal);line-height:1.4;}
.contact-card{background:var(--teal);color:#fff;border-radius:14px;padding:24px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin:0;}
.contact-card h4{margin:0 0 6px;color:var(--lime);font-size:15px;line-height:1.4;}
.contact-card p{margin:0;font-size:13px;line-height:1.6;color:rgba(255,255,255,.85);}
.cheat-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:0;}
.cheat-table th,.cheat-table td{border:1px solid var(--border);padding:11px 12px;text-align:left;line-height:1.5;}
.cheat-table th{background:var(--bg);color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;}
.pdf-cta{text-align:center;margin:8px 0 0;}

.cert-form-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin:0;}
.cert-form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;}
.cert-input{flex:1;min-width:220px;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;font-family:'Poppins',sans-serif;color:var(--navy);}
.cert-input:focus{outline:none;border-color:var(--teal);}

@media (max-width:880px){
  .layout{flex-direction:column;padding:16px 14px 60px;}
  .sidebar{width:100%;}
  .sidebar-inner{position:static;display:flex;overflow-x:auto;gap:6px;padding:8px;}
  .step-item{flex-direction:column;align-items:center;text-align:center;min-width:96px;gap:6px;}
  .step-sub{display:none;}
  .card-panel{padding:30px 22px 34px;}
  .section-title{font-size:23px;}
  .cover-hero{padding:32px 22px;}
}
.hide{display:none !important;}

/* ============ PDF GUIDE + CERTIFICATE (rendered off-screen, captured to PDF via JS) ============ */
#printGuide,#printCert{
  position:fixed; top:0; left:-99999px; z-index:-1;
  background:#fff;
}
#printGuide{width:760px; font-family:'Poppins',Arial,sans-serif; color:#222;}
#printCert{width:1500px;}

#printGuide .pg-cover{padding:56px 92px 40px;text-align:center;}
#printGuide .pg-cover .pg-logo-img{height:26px;margin:0 auto 20px;display:block;}
#printGuide .pg-title{font-size:26px;color:#004846;margin:0 0 10px;font-weight:700;}
#printGuide .pg-sub{font-size:13px;color:#555;margin:0 0 6px;}
#printGuide .pg-date{font-size:10.5px;color:#8a8f94;margin-top:26px;}
#printGuide .pg-cover-rule{width:70px;height:4px;background:#b9f400;margin:22px auto 0;border-radius:4px;}

#printGuide .pg-body{padding:0 92px 92px;}
#printGuide h2{
  font-size:20px;color:#004846;font-weight:700;
  margin:36px 0 18px;padding-bottom:10px;
  border-bottom:2px solid #004846;
}
#printGuide h2:first-of-type{margin-top:0;}
#printGuide h3{font-size:12.5px;color:#006c51;font-weight:700;margin:20px 0 8px;}
#printGuide h3:first-of-type{margin-top:2px;}
#printGuide p{font-size:11px;line-height:1.65;color:#2a2a2a;margin:0 0 10px;}
#printGuide ul{margin:4px 0 12px;padding-left:0;list-style:none;}
#printGuide li{font-size:11px;line-height:1.6;color:#2a2a2a;display:flex;align-items:flex-start;margin-bottom:5px;}
#printGuide .pg-dot{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:#59b367;margin:6px 9px 0 2px;display:inline-block;}
#printGuide .pg-assessment-mid{margin-bottom:6px;}
#printGuide table{width:100%;border-collapse:collapse;font-size:10.5px;margin:6px 0 16px;}
#printGuide th{background:#004846;color:#fff;font-weight:600;padding:7px 9px;text-align:left;}
#printGuide td{border:1px solid #dfe5e2;padding:6px 9px;text-align:left;}
#printGuide tr:nth-child(even) td{background:#f6f9f7;}
#printGuide .pg-construct-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;}
#printGuide .pg-construct{border-left:2px solid #59b367;padding:2px 0 2px 10px;margin-bottom:4px;}
#printGuide .pg-construct b{display:block;font-size:10.5px;color:#004846;}
#printGuide .pg-construct span{font-size:10px;color:#555;line-height:1.5;}
#printGuide .pg-assessment{margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #eef1f0;}
#printGuide .pg-assessment:last-child{border-bottom:none;}
#printGuide .pg-tag{display:inline-block;font-size:9.5px;font-weight:700;color:#5c6b00;background:#f7ffdc;padding:3px 9px;border-radius:100px;margin-bottom:8px;}
#printGuide .pg-footer-note{font-size:9.5px;color:#8a8f94;text-align:center;margin-top:30px;padding-top:10px;border-top:1px solid #eee;}

/* certificate visual (redesign: dark sidebar + main content panel).
   Proportioned so the whole design's own aspect ratio approaches A4
   landscape (~1.41:1): a "contain fit" of a much-wider-than-tall shape
   into a landscape page leaves large dead vertical margins, which is
   why this needs generous vertical padding/spacing, not just a bigger
   scale-up at export time. */
.cert-page{
  width:100%;
  box-sizing:border-box;
  display:flex;
  align-items:stretch;
  font-family:'Poppins',Arial,sans-serif;
  background:#fff;
}
.cert-sidebar{
  flex:0 0 160px;
  width:160px;
  box-sizing:border-box;
  background:var(--teal);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:56px 0;
}
.cert-dot{width:12px;height:12px;border-radius:50%;background:var(--lime);flex:0 0 auto;}
.cert-vertical-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
.cert-vertical-label{
  white-space:nowrap;
  transform:rotate(90deg);
  color:#fff;font-size:14px;letter-spacing:.16em;font-weight:500;
}
.cert-sidebar-rule{width:1px;height:130px;background:rgba(255,255,255,0.35);flex:0 0 auto;}
.cert-main{flex:1;box-sizing:border-box;padding:132px 90px 112px;text-align:center;}
.cert-logo{height:30px;margin:0 auto 44px;display:block;}
.cert-eyebrow{font-size:17px;font-weight:600;color:var(--green-sec);margin-bottom:18px;}
.cert-title{font-size:50px;font-weight:800;color:var(--teal);line-height:1.22;margin-bottom:56px;}
.cert-divider-row{display:flex;align-items:center;justify-content:center;margin-bottom:40px;}
.cert-divider-line{flex:0 0 220px;height:1px;background:#e0e0e0;display:inline-block;}
.cert-presented{font-size:14px;color:#9e9e9e;white-space:nowrap;margin:0 22px;}
.cert-name{font-size:40px;font-weight:700;color:var(--navy);margin-bottom:40px;}
.cert-body{font-size:15.5px;line-height:1.95;color:var(--navy);max-width:760px;margin:0 auto 88px;}
.cert-footer-row{display:flex;justify-content:center;margin-bottom:42px;}
.cert-footer-col{display:flex;flex-direction:column;align-items:center;}
.cert-footer-col + .cert-footer-col{margin-left:100px;}
.cert-footer-label{font-size:13.5px;color:#9e9e9e;margin-bottom:10px;}
.cert-footer-value{font-size:17.5px;font-weight:700;color:var(--navy);}
.cert-footer-divider{height:1px;background:#e0e0e0;margin:0 auto 34px;width:100%;}
.cert-bottom-bar{width:32px;height:5px;border-radius:3px;background:var(--lime);margin:0 auto;}
</style>

<script>
/* =========================================================================
   DATA
   ========================================================================= */

const SECTIONS = [
  {id:0, key:"cover",     title:"Welcome",                             tag:"Start here", hasQuiz:false},
  {id:1, key:"intro",     title:"What Are Psychometric Assessments?",  tag:"Foundations", hasQuiz:true},
  {id:2, key:"language",  title:"Psychometric Language",               tag:"Norms &amp; sten scores", hasQuiz:true},
  {id:3, key:"library",   title:"The JOBJACK Assessment Library",      tag:"All assessments and their constructs, explained", hasQuiz:true},
  {id:4, key:"hub",       title:"Navigating the Assessments and Checks Portal", tag:"Sending and reviewing requests", hasQuiz:true},
  {id:5, key:"insights",  title:"Assessment Insights Training",        tag:"Coaching tips by construct", hasQuiz:true},
  {id:6, key:"finale",    title:"Wrap-Up & Certificate",               tag:"You're certified", hasQuiz:false}
];
const TOTAL_QUIZZED = SECTIONS.filter(s=>s.hasQuiz).length;
const TOTAL_CONTENT_SECTIONS = SECTIONS.length - 2; // excludes the Welcome cover and the Finale, used for "Section X of Y" labels
const OUTPUT_MODE = "norm"; // legacy flag, retained for compatibility; this edition now uses sten scoring throughout (see outputLabel)
const EDITION_SLUG = "assessments-only"; // machine-readable edition id, used for local-storage keys and tracking rows

/* ---- OPTIONAL: Google Sheet tracking ----
   Paste a deployed Google Apps Script Web App URL here to log quiz
   scores and certificate downloads to a Google Sheet. Leave blank to
   disable tracking entirely; nothing is sent anywhere in that case.
   See the accompanying Apps Script (tracking-script.gs) for setup. */
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwSQkeDt9hk3BTcpH46svBoeN8vunUZkK0EbJqHO0ppoW6ItriW34l7pxB4Es_UjqoF/exec";

function sendTrackingEvent(eventType, payload){
  if(!SHEET_WEBHOOK_URL) return; // tracking disabled
  try{
    const body = Object.assign({event:eventType, edition:EDITION_SLUG, ts:new Date().toISOString()}, payload);
    fetch(SHEET_WEBHOOK_URL, {
      method:"POST",
      mode:"no-cors", // Apps Script web apps don't send CORS headers back; no-cors still delivers the request server-side, we just can't read the (unneeded) response
      headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoids a CORS preflight; Apps Script reads the raw body regardless of the declared type
      body: JSON.stringify(body)
    }).catch(function(){ /* fire-and-forget: a network hiccup here should never interrupt the candidate's experience */ });
  }catch(e){ /* ignore */ }
}
function outputLabel(item){
  return "Sten (1-10)";
}

/* ---- STATE ---- */
let state = {
  currentSection: 0,
  unlockedUpTo: 1,
  sectionPassed: {},
  quizMode: {},
  quizAnswers: {},
  quizSubmitted: {},
  sectionScore: {},   // last submitted score per section, e.g. {1: 4} meaning 4/5, used for the certificate-download tracking row
  certName: ""         // remembered across a refresh/return so the name field doesn't need retyping
};

/* ---- SAME-DEVICE PROGRESS SAVE/RESUME (browser local storage) ----
   Lets a candidate close the tab and come back later on the same
   browser/device and pick up where they left off. Nothing here is sent
   anywhere; it only lives in this browser. Versioned so a future
   change to the quiz/section structure can't collide with old saved
   data from a previous edition of this file. */
const STORAGE_VERSION = 2; // bumped: the section list changed, so progress saved by older versions is ignored
const STORAGE_KEY = "jobjack_ait_progress_" + EDITION_SLUG + "_v" + STORAGE_VERSION;

function saveProgress(){
  try{
    const toSave = {
      v: STORAGE_VERSION,
      savedAt: new Date().toISOString(),
      state: {
        currentSection: state.currentSection,
        unlockedUpTo: state.unlockedUpTo,
        sectionPassed: state.sectionPassed,
        quizAnswers: state.quizAnswers,
        quizSubmitted: state.quizSubmitted,
        sectionScore: state.sectionScore,
        certName: state.certName
      }
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }catch(e){ /* storage unavailable (private browsing etc.): fail silently, training still works without resume */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || parsed.v !== STORAGE_VERSION || !parsed.state) return null;
    return parsed;
  }catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){ /* ignore */ }
}

function showResumeToast(){
  const toast = document.createElement("div");
  toast.textContent = "Welcome back! Resuming where you left off.";

<h2 class="section-title">What Are Psychometric Assessments?</h2>
<p class="section-lead">Before you interpret a single score, it helps to know what these assessments actually measure, why JOBJACK built its own assessments, and what keeps them fair, legal and trustworthy.</p>

<h3 class="block-title">The basics</h3>
<p class="body-text"><b>Psychometric assessments</b> are standardised tools designed to measure psychological attributes that are difficult to see or observe directly, things like problem-solving ability, literacy, or workplace behaviour preferences.</p>
${ICEBERG_SVG}
<p class="body-text" style="margin-top:16px;"><b>Hiring is often described as an iceberg.</b> A CV and interview mostly reveal what's easy to see above the waterline: skills, knowledge and experience. Psychometric assessments surface what's harder to observe directly, the mental abilities, personality traits and preferences below the waterline, which often predict on-the-job performance just as strongly.</p>

<h3 class="block-title">What assessments are used for</h3>
<div class="grid grid-4">

<div class="section-eyebrow">Section 2 of ${TOTAL_CONTENT_SECTIONS}</div>
<h2 class="section-title">Psychometric Language</h2>
<p class="section-lead">Norm groups and sten scores are the two terms you'll see regularly on the platform. Get comfortable with these and the rest of the platform reads itself.</p>

<h3 class="block-title">Norm Groups</h3>
<p class="body-text">A <b>norm group</b> is the reference population that a candidate's raw score is statistically compared against, to give that score meaning. Without a norm group, "scored 62" tells you nothing. JOBJACK's norm group is drawn from its <b>400,000+ South African entry-level candidate database</b>, so every comparison reflects the real SA job-seeker population, not an international or unrelated sample.</p>

<h3 class="block-title">What is a Sten Score?</h3>
<p class="body-text">A <b>sten</b> (short for "standard ten") score converts a candidate's raw result into a single number from <b>1 to 10</b>, based on how they compare to the norm group. It's one consistent scale used across every assessment in the library, so you're always reading the same kind of number, whichever assessment you're looking at.</p>
<p class="body-text" style="margin-top:10px;"><b>Example:</b> a sten of 8 means the candidate's result fell well above where most of the norm group scored. A sten of 3 means it fell well below.</p>

<h3 class="block-title">Sten Score Bands</h3>
<p class="body-text">Every sten score also maps to a simple descriptive band, so you don't need to mentally interpret the number alone:</p>
<table class="cheat-table">
<tr><th>Sten</th><th>Band</th><th>Meaning</th></tr>
<tr><td>9&ndash;10</td><td>Well Above Average</td><td>Scores higher than almost all of the norm group</td></tr>
<tr><td>7&ndash;8</td><td>Above Average</td><td>Comfortably above average</td></tr>
<tr><td>5&ndash;6</td><td>Average</td><td>Typical of the norm group</td></tr>
<tr><td>3&ndash;4</td><td>Below Average</td><td>Comfortably below average</td></tr>
<tr><td>1&ndash;2</td><td>Well Below Average</td><td>Scores lower than almost all of the norm group</td></tr>
</table>

<h3 class="block-title">A few more terms worth knowing</h3>
<div class="grid grid-3">
  <div class="tile"><h4>Reliability</h4><p>How consistent an assessment's results are over time. JOBJACK's assessments show a test-retest reliability of r = 0.82 to 0.88.</p></div>
  <div class="tile"><h4>Validity</h4><p>How accurately an assessment measures what it claims to measure, continuously monitored across JOBJACK's candidate database.</p></div>
  <div class="tile"><h4>Cronbach's Alpha</h4><p>A statistic measuring internal consistency of a set of items. JOBJACK's battery averages 0.91, a strong result.</p></div>
</div>
`;

function renderAssessmentAccordion(forceOpen){
  return ASSESSMENTS.map((a,i)=>{
    const groupsHtml = a.groups.map(g=>`
      <div class="subgroup-label">${g.label}</div>
      <div class="construct-grid">
        ${g.items.map(it=>`<div class="construct-box"><b>${it.n}</b><span>${it.d}</span></div>`).join("")}
      </div>
    `).join("");
    const openClass = forceOpen ? " open" : "";
    return `
    <div class="acc-item${openClass}" id="acc-${i}">
      <div class="acc-head" onclick="toggleAcc(${i})">
        <div class="acc-head-left">
          <div class="acc-num">${a.code}</div>
          <div>
            <div class="acc-head-title">${a.name}</div>
            <div class="acc-head-tag">${outputLabel(a)}</div>
          </div>
        </div>
        <div class="acc-chevron">&#9662;</div>
      </div>
      <div class="acc-body">
        <div class="acc-body-inner">
          <span class="output-pill">${outputLabel(a)}</span>
          <p class="body-text">${a.desc}</p>
          ${groupsHtml}
        </div>
      </div>
    </div>`;
  }).join("");
}

function toggleAcc(i){ document.getElementById("acc-"+i).classList.toggle("open"); }

<p class="body-text">At the top right you will see your <b>Credits</b> balance, a <b>Buy more</b> button and the green <b>+ Administer</b> button, which is how you send a new request. To find a specific request, use the <b>Candidate</b> search or the <b>Request reference</b> filter.</p>

<h3 class="block-title">2. Read the Hub</h3>
<p class="body-text">Each row is one request. The five columns, numbered in the screenshot above, tell you what you need at a glance:</p>
<table class="cheat-table hub-table">
<tr><th>Column</th><th>What it tells you</th></tr>
<tr><td><span class="col-num">1</span><b>Candidate &amp; request</b></td><td>The candidate's name, with the type of request underneath (for example Assessment &amp; check request, or Check request) or the reference you gave it.</td></tr>
<tr><td><span class="col-num">2</span><b>What's happening</b></td><td>The status of the request (for example Completed, Expired or Cancelled), with progress underneath, such as "2 of 2 completed".</td></tr>
<tr><td><span class="col-num">3</span><b>Next action</b></td><td>What to do next, with the reason underneath: <b>Review result</b> (the result is ready to view), <b>Resend or cancel request</b> (the request has expired), or <b>No action</b> (the request was manually cancelled).</td></tr>
<tr><td><span class="col-num">4</span><b>Due / completed</b></td><td>The date the request was completed. Expired requests show the expiry date in red, for example "Expired 2 Oct".</td></tr>
<tr><td><span class="col-num">5</span><b>Action</b></td><td>The green <b>View</b> button opens the candidate's details. Some rows also have a &#8942; menu next to View.</td></tr>
</table>

<h3 class="block-title">3. Understand the Sten badge</h3>
<p class="body-text">When a request that includes an assessment is completed, the <b>Next action</b> column shows a <b>Sten</b> badge, for example <b>Sten 1</b>. (A check-only request, like Peter Boock's, has no assessment to score, so it has no Sten badge.) The badge is the candidate's sten score on the 1 to 10 scale you learned in Section 2 (Psychometric Language), where each band is explained.</p>
<p class="body-text">The rule to remember: <b>a higher sten is better for the overall assessment</b>. The Sten 1 badges in the screenshot sit right at the bottom of the scale, while a Sten 9 or 10 sits at the top. (Individual constructs can work the other way: for example, a low Performance Detractors score is the positive one, which Assessment Insights Training covers.)</p>
<p class="body-text">The badge is a headline, not the whole story. Treat a middling result as worth a closer look, not an automatic pass or fail, and escalate to JOBJACK's Industrial Psychologists when in doubt.</p>

<h3 class="block-title">4. Send a new request</h3>
<p class="body-text">Click <b>+ Administer</b> at the top right of the Hub. A three-step wizard opens, with a progress bar along the top showing where you are. Credits are only used once the request is sent.</p>

<ul class="tip-list">
  <li><span class="tnum">1</span><span class="tl-text"><b>Checks</b> (here Credit Check, Risk Check and Matric Check) each show their price in credits and a <b>More info</b> link. Checks can only be run on candidates with a South African ID number, while assessments are available to all candidates.</span></li>
  <li><span class="tnum">2</span><span class="tl-text"><b>Assessment battery:</b> each assessment is a battery, a curated collection of assessments measuring the traits and competencies for a role. You can select one battery per request. Here the battery is PWP Ideal Profile Comparison.</span></li>
  <li><span class="tnum">3</span><span class="tl-text"><b>Total credits required</b> is shown at the bottom left. In this example, 49 credits for the Credit Check plus 10 for the battery gives 59. Click <b>Next</b>.</span></li>
</ul>

<div class="portal-step-label">Step 2 of 3: Candidate details</div>
<p class="body-text">Choose how you want to add candidates: <b>Manual</b> or <b>Upload a list</b>. Whichever you choose, the candidate is contacted on every method you select.</p>
<p class="body-text"><b>Option A: Manual.</b> Ideal for a small number of candidates.</p>

  <h4>Why the ID number matters</h4>
  <p>Whichever option you use, always give the candidate's full, correct ID number. Assessment results are linked to a candidate's ID for governance purposes: it keeps a result correctly and uniquely attributed to that person, which matters for audit trails and for being able to defend a hiring decision later.</p>

<h3 class="block-title">6. Tips for working in the Hub</h3>
<ul class="tip-list">

  <li><span class="tnum">2</span><span class="tl-text">Awaiting consent or No report yet means the candidate still needs to consent to share, it is not a problem with the assessment.</span></li>

function renderSidebar(){
  const host = document.getElementById("sidebarNav");
  host.innerHTML = SECTIONS.map(s=>{
    const locked = s.id > state.unlockedUpTo;
    const done = !!state.sectionPassed[s.id];
    const active = s.id === state.currentSection;
    let cls = "step-item";
    if(locked) cls += " locked";
    if(active) cls += " active";
    if(done) cls += " done";
    let badge;
    if(s.key==="cover") badge = "&ndash;";
    else if(s.key==="finale") badge = "&#10003;";
    else badge = done ? "&#10003;" : s.id;
    return `<div class="${cls}" onclick="goTo(${s.id})">
      <div class="step-badge">${badge}</div>
      <div>
        <div class="step-text">${s.title}</div>
        <div class="step-sub">${s.tag}</div>
      </div>
    </div>`;
  }).join("");

  const doneCount = Object.keys(state.sectionPassed).length;
  const cur = SECTIONS[state.currentSection];
  let label;
  if(cur.key==="cover") label = "Welcome";
  else if(cur.key==="finale") label = "Training complete";
  else label = "Section " + state.currentSection + " of " + TOTAL_CONTENT_SECTIONS;
  document.getElementById("overallLabel").textContent = label;
  document.getElementById("overallFill").style.width = Math.round((doneCount/TOTAL_QUIZZED) * 100) + "%";
}

function goTo(idx){
  if(idx > state.unlockedUpTo) return;
  state.currentSection = idx;
  state.quizMode[idx] = state.quizMode[idx] || false;
  renderAll();
}

function renderAll(){
  renderSidebar();
  renderMain();
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderMain(){
  const idx = state.currentSection;
  const panel = document.getElementById("mainPanel");
  const sec = SECTIONS[idx];

  if(!sec.hasQuiz){
    panel.innerHTML = contentFor(idx) + navFooter(idx);
  }else{
    const showingQuiz = !!state.quizMode[idx];
    if(!showingQuiz){
      panel.innerHTML = contentFor(idx) + quizIntroBlock(idx) + navFooter(idx);
    }else{
      panel.innerHTML = quizBlock(idx) + navFooter(idx);
    }
  }

  attachCertNameValue();
  saveProgress();
}

function attachCertNameValue(){
  const input = document.getElementById("certName");
  if(input && state.certName) input.value = state.certName;
}

function switchJVTab(name){
  ["assess","ipc"].forEach(function(n){
    const btn = document.getElementById("jvtab-"+n);
    const panel = document.getElementById("jvpanel-"+n);
    if(btn) btn.classList.toggle("active", n===name);
    if(panel) panel.classList.toggle("active", n===name);
  });
}

function quizIntroBlock(idx){
  const passed = state.sectionPassed[idx];
  return `
  <div class="quiz-wrap">
    <div class="quiz-intro">
      <div>
        <h4>${passed ? "Section check complete" : "Section check"}</h4>
        <p>${passed ? "You already passed this section's quiz. You can retake it any time." : "Answer 5 short questions about this section. You need "+PASS_MARK+"/"+TOTAL_Q+" correct to continue."}</p>
      </div>
      <button class="btn btn-primary" onclick="startQuiz(${idx})">${passed ? "Retake quiz" : "Start quiz"}</button>
    </div>
  </div>`;
}

function startQuiz(idx){
  state.quizMode[idx] = true;
  state.quizSubmitted[idx] = false;
  state.quizAnswers[idx] = new Array(TOTAL_Q).fill(null);
  renderMain();
  window.scrollTo({top:0, behavior:"auto"});
}

function exitQuiz(idx){
  state.quizMode[idx] = false;
  renderMain();
  window.scrollTo({top:0, behavior:"auto"});
}

function selectAnswer(secIdx, qIdx, optIdx){
  if(state.quizSubmitted[secIdx]) return;
  state.quizAnswers[secIdx][qIdx] = optIdx;
  const allAnswered = state.quizAnswers[secIdx].every(a=>a!==null);
  if(allAnswered){
    state.quizSubmitted[secIdx] = true;
    // Record the score so it can be reported later (e.g. bundled into
    // the certificate-download tracking row) without needing to re-grade.
    const qs = QUIZZES[secIdx];
    let score = 0;
    qs.forEach((q,i)=>{ if(state.quizAnswers[secIdx][i]===q.correct) score++; });
    state.sectionScore[secIdx] = score;
  }
  renderMain();
  if(allAnswered){
    setTimeout(function(){
      const el = document.getElementById("resultBanner");
      if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
    }, 60);
  }
}

function quizBlock(idx){
  const questions = QUIZZES[idx];
  const answers = state.quizAnswers[idx] || new Array(TOTAL_Q).fill(null);
  const submitted = !!state.quizSubmitted[idx];

  let score = 0;
  if(submitted){
    questions.forEach((q,i)=>{ if(answers[i]===q.correct) score++; });
  }

  const qHtml = questions.map((q,qi)=>{
    const picked = answers[qi];
    const optsHtml = q.opts.map((opt,oi)=>{
      let cls = "opt-label";
      if(picked===oi && !submitted) cls += " picked";
      if(submitted){
        const passedOverall = score >= PASS_MARK;
        if(passedOverall && score < TOTAL_Q){
          if(oi===q.correct && picked!==q.correct) cls += " correct-mark";
          if(oi===picked && picked!==q.correct) cls += " wrong-mark";
          if(oi===picked && picked===q.correct) cls += " correct-mark";
        } else if(passedOverall && score===TOTAL_Q){
          if(oi===picked) cls += " correct-mark";
        }
      }
      const disabled = submitted ? "disabled" : "";
      const checked = picked===oi ? "checked" : "";
      return `<label class="${cls}">
        <input type="radio" name="q${idx}_${qi}" ${checked} ${disabled} onclick="selectAnswer(${idx},${qi},${oi})">
        <span>${opt}</span>
      </label>`;
    }).join("");

    return `<div class="quiz-q">
      <div class="qhead"><div class="qnum-badge">${qi+1}</div><div class="qtext">${q.q}</div></div>
      ${optsHtml}
    </div>`;
  }).join("");

  let resultHtml = "";
  if(submitted){
    const passed = score >= PASS_MARK;
    if(passed){
      resultHtml = `<div class="result-banner pass" id="resultBanner">
        <div class="result-badge">${score}/${TOTAL_Q}</div>
        <div>
          <h4>Section passed</h4>
          <p>${score===TOTAL_Q ? "Perfect score, nothing to review." : "Nice work. Review any question marked above, then continue."}</p>
        </div>
      </div>`;
    }else{
      resultHtml = `<div class="result-banner fail" id="resultBanner">
        <div class="result-badge">${score}/${TOTAL_Q}</div>
        <div>
          <h4>Not quite, you need ${PASS_MARK}/${TOTAL_Q} to continue</h4>
          <p>No problem, have another attempt. Re-read the section above if you'd like, then try the quiz again.</p>
        </div>
      </div>`;
    }
  }

  let actionsHtml = "";
  if(!submitted){
    actionsHtml = `<div class="quiz-actions">
      <button class="btn btn-outline" onclick="exitQuiz(${idx})">Back to section</button>
    </div>`;
  }else{
    const passed = score >= PASS_MARK;
    if(passed){
      actionsHtml = `<div class="quiz-actions">
        <button class="btn btn-outline" onclick="exitQuiz(${idx})">Review section again</button>
        <button class="btn btn-lime" onclick="passAndContinue(${idx})">Continue</button>
      </div>`;
    }else{
      actionsHtml = `<div class="quiz-actions">
        <button class="btn btn-outline" onclick="exitQuiz(${idx})">Back to section</button>
        <button class="btn btn-primary" onclick="startQuiz(${idx})">Try again</button>
      </div>`;
    }
  }

  return `<div class="section-eyebrow">Section ${idx} check</div>
  <h2 class="section-title">Quiz: ${SECTIONS[idx].title}</h2>
  <p class="section-lead">Score ${PASS_MARK}/${TOTAL_Q} or higher to unlock the next section. Your result appears at the bottom once you've answered all 5.</p>
  ${qHtml}
  ${resultHtml}
  ${actionsHtml}`;
}

function passAndContinue(idx){
  state.sectionPassed[idx] = true;
  state.quizMode[idx] = false;
  if(idx+1 <= SECTIONS.length-1){
    state.unlockedUpTo = Math.max(state.unlockedUpTo, idx+1);
    state.currentSection = idx+1;
  }
  renderAll();
}

function navFooter(idx){
  if(idx===0) return "";
  const sec = SECTIONS[idx];
  const isLast = idx === SECTIONS.length-1;
  let nextBtn = "";
  if(!isLast){
    const canAdvance = state.sectionPassed[idx] || !sec.hasQuiz;
    const advanceCall = sec.hasQuiz ? `goTo(${idx+1})` : `continueSection(${idx})`;
    nextBtn = canAdvance
      ? `<button class="btn btn-primary" onclick="${advanceCall}">Next section</button>`
      : `<span class="locked-note">Pass this section's quiz to continue</span>`;
  }
  return `<div class="nav-footer">
    <button class="btn btn-outline" onclick="goTo(${idx-1})">Previous</button>
    ${nextBtn}
  </div>`;
}

function continueSection(idx){
  // Advances past a section that has no quiz (so it isn't counted toward
  // the quiz-based progress bar via sectionPassed), unlocking the next
  // section the same way passing a quiz would.
  state.quizMode[idx] = false;
  if(idx+1 <= SECTIONS.length-1){
    state.unlockedUpTo = Math.max(state.unlockedUpTo, idx+1);
    state.currentSection = idx+1;
  }
  renderAll();
}

function restartTraining(){
  state = {currentSection:0, unlockedUpTo:1, sectionPassed:{}, quizMode:{}, quizAnswers:{}, quizSubmitted:{}, sectionScore:{}, certName:""};
  renderAll();
  clearProgress(); // after renderAll(), since its own render cycle would otherwise immediately re-save the (now-reset) state
}

/* =========================================================================
   PDF EXPORT HELPER (renders an off-screen element to a real PDF file,
   with no browser print dialog involved, so no browser header/footer)
   ========================================================================= */
async function elementToPdf(el, filename, orientation, centerSingle){
  const renderScale = centerSingle ? 3 : 2;   // extra resolution so the enlarged certificate stays crisp
  const canvas = await html2canvas(el, {scale:renderScale, backgroundColor:"#ffffff", useCORS:true});
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation: orientation, unit:"pt", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgData = canvas.toDataURL("image/png");

  if(centerSingle){
    // Fit the image as large as possible within a small margin,
    // preserving its aspect ratio (never distorting it), and center it
    // on the page. The design's own proportions are tuned to closely
    // match A4 landscape, so this now fills almost the entire page.
    const margin = 14;
    const maxW = pageWidth - margin * 2;
    const maxH = pageHeight - margin * 2;
    const nativeAspect = canvas.width / canvas.height;
    let w = maxW, h = w / nativeAspect;
    if(h > maxH){ h = maxH; w = h * nativeAspect; }
    const x = (pageWidth - w) / 2;
    const y = (pageHeight - h) / 2;
    pdf.addImage(imgData, "PNG", x, y, w, h);
  }else{
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * (imgWidth / canvas.width);
    if(imgHeight <= pageHeight){
      pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
    }else{
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while(heightLeft > 0){
        position = -(imgHeight - heightLeft);
        pdf.addPage();
        pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }
    }
  }
  pdf.save(filename);
}

/* ---------------------------------------------------------------------
   Smart-paginated PDF export for the reference guide.
   Instead of slicing one giant screenshot into fixed-height chunks
   (which cuts headers and sentences mid-line), this measures each
   top-level block in the live off-screen render, packs whole blocks
   onto a page without splitting any of them, and gives every
   continuation page some open space at the top (mirroring the cover
   page's breathing room) before its content resumes.
   --------------------------------------------------------------------- */
async function guideToPdf(host, filename){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:"portrait", unit:"pt", format:"a4"});
  const pageWidthPt = pdf.internal.pageSize.getWidth();
  const pageHeightPt = pdf.internal.pageSize.getHeight();

  // html2canvas renders <li>::before pseudo-elements unreliably (the
  // bullet ends up shrunk and stuck to the top of the line instead of
  // centered), so use real DOM nodes for bullets instead.
  host.querySelectorAll("li").forEach(function(li){
    const dot = document.createElement("span");
    dot.className = "pg-dot";
    li.insertBefore(dot, li.firstChild);
  });

  // Some .pg-assessment blocks (e.g. the PWP trait entry) are
  // taller than a full page by themselves. Treating them as one
  // unsplittable unit either wastes most of a page or forces the whole
  // block onto one page image taller than the PDF page, which then had
  // to be squished to fit: the "squished" look. Split each one into
  // its natural sub-parts (header+intro, then each labelled construct
  // group) so pagination can break between them like any other block.
  //
  // Some individual construct-grids are themselves huge (e.g. a
  // dev-tips grid with many items in one grid, far taller than a
  // page on its own), so grids also get chunked into small groups of
  // rows, each becoming its own independent block.
  const MAX_GRID_ITEMS = 6; // ~3 rows of the 2-column grid per chunk
  function chunkGrid(gridEl){
    const items = Array.from(gridEl.children);
    if(items.length <= MAX_GRID_ITEMS) return [gridEl];
    const chunks = [];
    for(let i = 0; i < items.length; i += MAX_GRID_ITEMS){
      const g = document.createElement("div");
      g.className = "pg-construct-grid";
      items.slice(i, i + MAX_GRID_ITEMS).forEach(function(it){ g.appendChild(it); });
      chunks.push(g);
    }
    return chunks;
  }

  Array.from(host.querySelectorAll(".pg-body > .pg-assessment")).forEach(function(block){
    const kids = Array.from(block.children);
    let i = 0;
    const headerFrag = document.createElement("div");
    headerFrag.dataset.hdr = "1";
    while(i < kids.length){
      const k = kids[i];
      const isHeaderPart = k.tagName === "H3" || k.tagName === "P" || (k.classList && k.classList.contains("pg-tag"));
      if(!isHeaderPart) break;
      headerFrag.appendChild(k);
      i++;
    }
    const fragments = [headerFrag];
    while(i < kids.length){
      const k = kids[i];
      if(k.classList && k.classList.contains("pg-construct-grid")){
        // Standalone grid directly after the header (the devHtml case,
        // e.g. dev-tips entries with no per-subgroup labels). Chunk it
        // if it's large; each chunk becomes its own independent block.
        chunkGrid(k).forEach(function(g){
          const f = document.createElement("div");
          f.appendChild(g);
          fragments.push(f);
        });
        i++;
      }else{
        // A labelled subgroup (e.g. "CONSTRUCTS") followed by its grid
        // (the ASSESSMENTS library case). Keep the label with the FIRST
        // chunk of its grid; any extra chunks (if the grid was large)
        // become their own separate blocks.
        const frag = document.createElement("div");
        frag.appendChild(k);
        i++;
        if(i < kids.length && kids[i].classList && kids[i].classList.contains("pg-construct-grid")){
          const chunks = chunkGrid(kids[i]);
          i++;
          frag.appendChild(chunks[0]);
          fragments.push(frag);
          for(let c = 1; c < chunks.length; c++){
            const f2 = document.createElement("div");
            f2.appendChild(chunks[c]);
            fragments.push(f2);
          }
        }else{
          fragments.push(frag);
        }
      }
    }
    fragments.forEach(function(f, idx){
      f.className = (idx === fragments.length - 1) ? "pg-assessment" : "pg-assessment-mid";
    });
    fragments.forEach(function(f){ block.parentNode.insertBefore(f, block); });
    block.parentNode.removeChild(block);
  });

  const hostWidthPx = host.getBoundingClientRect().width || 760;
  const ptPerPx = pageWidthPt / hostWidthPx;
  // "Normal" page margins (~1 inch / 72pt) on every side, expressed in
  // the host's own CSS px space so it matches the .pg-body side padding.
  const NORMAL_MARGIN_PX = 72 / ptPerPx;
  const PAGE_PX = (pageHeightPt / ptPerPx) - NORMAL_MARGIN_PX;   // reserve a bottom margin on every page
  const CONT_TOP_PAD = NORMAL_MARGIN_PX;                          // same margin as top-of-page breathing room on continuation pages

  const coverEl = host.querySelector(".pg-cover");
  const bodyEl = host.querySelector(".pg-body");
  const hostRect = host.getBoundingClientRect();
  const coverHeight = coverEl ? (coverEl.getBoundingClientRect().bottom - hostRect.top) : 0;

  const blocks = Array.from(bodyEl.children).map(function(el){
    const r = el.getBoundingClientRect();
    return { el: el, top: r.top - hostRect.top, bottom: r.bottom - hostRect.top, tag: el.tagName };
  });

  const pages = [];
  let current = { isFirst: true, blocks: [], budget: PAGE_PX - coverHeight };
  let cursor = 0;
  // A heading may only stay at the bottom of a page if there's still
  // room for roughly 4 sentences of normal body text underneath it
  // there; otherwise it moves to the top of the next page instead.
  const MIN_FOLLOWUP_PX = 80;

  for(let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    const h = b.bottom - b.top;
    const isHeader = (b.tag === "H2" || b.tag === "H3" || (b.el.dataset && b.el.dataset.hdr === "1"));
    let fits = (cursor + h) <= current.budget;

    // Don't strand a heading alone at the bottom of a page: it may only
    // go here if there's still room left afterward for a few sentences
    // of normal text (not just squeezed in with nothing following it).
    if(fits && isHeader && current.blocks.length > 0){
      if((cursor + h + MIN_FOLLOWUP_PX) > current.budget) fits = false;
    }

    if(!fits && current.blocks.length > 0){
      pages.push(current);
      current = { isFirst: false, blocks: [], budget: PAGE_PX - CONT_TOP_PAD };
      cursor = 0;
    }

    current.blocks.push(b.el);
    cursor += h;
  }
  if(current.blocks.length) pages.push(current);

  let firstPageWritten = false;
  for(let p = 0; p < pages.length; p++){
    let pg = pages[p];
    // Render this page, then VERIFY against the real rendered height:
    // do not just trust the upfront pixel estimate. If the actual
    // rendered image is taller than one PDF page (font metrics,
    // sub-pixel rounding, etc. can all make the real render taller than
    // estimated), move its last block onto the front of the next page
    // and re-render. This self-corrects regardless of any estimation
    // error, so a page can never silently overflow into a squished or
    // near-blank sliced continuation page.
    let canvas, imgWidth, imgHeight;
    while(true){
      const wrapper = document.createElement("div");
      wrapper.className = "pg-body";
      if(!pg.isFirst) wrapper.style.paddingTop = CONT_TOP_PAD + "px";
      pg.blocks.forEach(function(el){ wrapper.appendChild(el); });

      host.innerHTML = "";
      if(pg.isFirst && coverEl) host.appendChild(coverEl);
      host.appendChild(wrapper);

      canvas = await html2canvas(host, {scale:2, backgroundColor:"#ffffff", useCORS:true});
      imgWidth = pageWidthPt;
      imgHeight = canvas.height * (imgWidth / canvas.width);

      if(imgHeight <= pageHeightPt + 0.5 || pg.blocks.length <= 1) break;

      // Overflow: bump the last block to the next page and retry.
      const overflowEl = pg.blocks.pop();
      if(p + 1 >= pages.length) pages.push({ isFirst: false, blocks: [] });
      pages[p + 1].blocks.unshift(overflowEl);
    }
    const imgData = canvas.toDataURL("image/png");

    if(imgHeight <= pageHeightPt + 0.5){
      // Normal case: this page's content fits within one physical PDF
      // page, drawn at its true aspect ratio (never distorted).
      if(firstPageWritten) pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
      firstPageWritten = true;
    }else{
      // Extremely rare: a single block that's still taller than one
      // whole page even alone. Slice it losslessly across multiple
      // physical pages instead of squishing it to fit.
      let heightLeft = imgHeight, position = 0;
      while(heightLeft > 0){
        if(firstPageWritten) pdf.addPage();
        pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
        firstPageWritten = true;
        heightLeft -= pageHeightPt;
        position -= pageHeightPt;
      }
    }
  }

  pdf.save(filename);
}

  <div class="pg-body">
  <h2>1. What Are Psychometric Assessments?</h2>
  <p>Psychometric assessments are standardised tools designed to measure psychological attributes that are difficult to see or observe directly, things like problem-solving ability, literacy, or workplace behaviour preferences.</p>
  <h3>Hiring is an iceberg</h3>
  <p>A CV and interview mostly reveal what's easy to see above the waterline: skills, knowledge and experience. Psychometric assessments surface what's harder to observe directly, below the waterline: mental abilities, personality traits and preferences.</p>
  <h3>What assessments are used for</h3>
  <ul><li>Screening candidates: filtering large applicant pools efficiently and fairly.</li>
  <li>Talent identification: spotting strong performers early, beyond the CV.</li>
  <li>Developmental insights: understanding growth areas once someone is hired.</li>
  <li>Workforce planning: making informed, data-backed people decisions at scale.</li></ul>
  <h3>How assessments are applied</h3>
  <ul><li>Prompted on application: candidates are invited to assess when they apply for a job on JOBJACK.</li>
  <li>Retake after 180 days: candidates can take the assessments again once 180 days have passed since their last attempt.</li>
  <li>Average completion time is approximately 30 minutes.</li></ul>
  <h3>Compliance and ASSA certification</h3>
  <p>As stipulated by the Employment Equity Act (EEA) No. 55 of 1998, every assessment JOBJACK uses in hiring decisions must be valid and reliable, fair, and unbiased. JOBJACK's assessments are certified by Assessment Standards South Africa (ASSA); the Potential Work Performance Trait Assessment carries a current ASSA review certificate valid until 1 October 2035. For employers, ASSA certification means confidence in unbiased, scientific evaluation; legal and ethical compliance; protection for both employers and candidates; and data-backed decisions rather than guesswork.</p>
  <h3>Why JOBJACK built its own assessments</h3>
  <ul><li>SA-normed, industry-specific validation with store-level behavioural indicators.</li>
  <li>Emic assessments developed internally to measure cultural and behavioural nuances relevant to South Africa.</li>
  <li>Automated scoring with unlimited volume and real-time results, built for South African store-level hiring needs.</li>
  <li>A 400,000+ SA candidate database with living norms and continuous predictive validity monitoring (0.91 Cronbach's Alpha Coefficient; test-retest r = 0.82 to 0.88; configural and metric invariance).</li>
  <li>Full ASSA compliance and certification.</li></ul>
  <h3>Assessment integrity and anti-cheating</h3>
  <ul><li>Identity verification: mandatory ID consent before the assessment begins, creating accountability.</li>
  <li>Technical safeguards: timed questions and randomised question/answer order per candidate.</li>
  <li>Strategic design: only 2 of 5 standard-battery assessments have scored right/wrong answers, and there is no feedback system, so candidates never learn the correct answers.</li>
  <li>Accessibility-first: no webcam requirement and no complex ID upload process.</li></ul>

  <h2>2. Psychometric Language</h2>
  <p>A norm group is the reference population a candidate's score is compared against; JOBJACK's is its 400,000+ South African entry-level candidate database. A sten (standard ten) score converts a candidate's raw result into a single number from 1 to 10 based on that comparison, one consistent scale used across every assessment in the library.</p>
  <table>
    <tr><th>Sten</th><th>Band</th></tr>
    <tr><td>9 to 10</td><td>Well Above Average</td></tr>
    <tr><td>7 to 8</td><td>Above Average</td></tr>
    <tr><td>5 to 6</td><td>Average</td></tr>
    <tr><td>3 to 4</td><td>Below Average</td></tr>
    <tr><td>1 to 2</td><td>Well Below Average</td></tr>
  </table>
  <h3>A few more terms</h3>
  <ul><li>Reliability: how consistent an assessment's results are over time (JOBJACK test-retest r = 0.82 to 0.88).</li>
  <li>Validity: how accurately an assessment measures what it claims to measure.</li>
  <li>Cronbach's Alpha: a statistic measuring internal consistency of a set of items (JOBJACK's battery averages 0.91).</li></ul>

  <h2>3. The JOBJACK Assessment Library</h2>
  <p>JOBJACK combines assessments from this library into different role-specific batteries; candidates do not all sit one fixed battery.</p>
  ${acc}

  <h2>4. Navigating the Assessments and Checks Portal</h2>
  <p>Open the Hub from the left-hand menu by clicking Assessments/Checks, which opens the Assessment &amp; Checks Hub, a list of every request you have sent. Each row shows the Candidate &amp; request, What's happening (status and progress), Next action, Due / completed and Action (the View button). Completed requests that include an assessment show a Sten badge: a score from 1 to 10 compared to the norm group (see Section 2 for the bands). A higher sten is better for the overall assessment.</p>
  <p>To send a new request, click + Administer and follow the three steps. Step 1, Select checks &amp; assessments: checks can only be run on candidates with a South African ID number, assessments are available to all candidates, and you can select one battery per request. Step 2, Candidate details: add candidates manually (name, surname, 13-digit SA ID number, and SMS and/or email) or upload a CSV list; always give the full, correct ID number, as results are linked to it for governance purposes. Step 3, Confirmation: review the details and credits, then click Send request; credits are deducted when you send.</p>
  <p>Click View on a candidate's row to see their personal info, assessment progress and checks. Results become available once the candidate consents to share them; until then you will see statuses such as Awaiting consent and No report yet.</p>
  <p>Tips: start with the Next action column; don't reject on one low sub-construct alone; escalate uncertainty to JOBJACK's Industrial Psychologists.</p>

  <h2>5. Assessment Insights Training</h2>
  <p>For most constructs, a low score is the development opportunity. Performance Detractors work the other way: because they measure negative tendencies, a high score is the one that signals a development need. Each item below lists two practical coaching tips.</p>
  ${devHtml}

  <h2>Questions?</h2>
  <p>Contact JOBJACK's Industrial Psychologists at jjassessments@gmail.com.</p>

}

}

function makeCertificateId(name, d){
  // Deterministic (not random) so re-downloading the same certificate in
  // the same session always yields the same ID: JJ-AIT-{year}-{4 digits}
  const seed = (name || "") + "|" + d.getFullYear() + "|" + d.getMonth() + "|" + d.getDate();
  let hash = 0;
  for(let i = 0; i < seed.length; i++){
    hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
  }
  const digits = String(hash % 10000).padStart(4, "0");
  return "JJ-AIT-" + d.getFullYear() + "-" + digits;
}

function scoresSummaryText(){
  return SECTIONS
    .map(function(s, i){
      if(!s.hasQuiz) return null;
      const sc = state.sectionScore[i];
      return s.title + ": " + (sc != null ? (sc + "/" + TOTAL_Q) : "not recorded");
    })
    .filter(Boolean)
    .join(" | ");
}

function downloadCertificate(){
  if(!isCourseCompleted()){
    alert("Your certificate unlocks once you've completed all sections.");
    return;
  }
  const input = document.getElementById("certName");
  const name = input ? input.value.trim() : "";
  if(!name){
    alert("Please enter your name to generate your certificate.");
    if(input) input.focus();
    return;
  }
  const issuedDate = new Date();
  const dateStr = formatDatePretty(issuedDate);
  const validUntilDate = new Date(issuedDate);
  validUntilDate.setFullYear(validUntilDate.getFullYear() + 4);
  const validUntilStr = formatDatePretty(validUntilDate);
  const certId = makeCertificateId(name, issuedDate);
  sendTrackingEvent("certificate_downloaded", {
    name: name,
    certId: certId,
    issuedDate: dateStr,
    validUntil: validUntilStr,
    scores: scoresSummaryText()
  });
  const host = document.getElementById("printCert");
  host.innerHTML = buildCertificateHTML(name, dateStr, validUntilStr, certId);
  const certEl = host.querySelector(".cert-page");
  elementToPdf(certEl, "JOBJACK-Certificate-of-Achievement.pdf", "landscape", true)
    .catch(function(err){ console.error(err); alert("Something went wrong generating the PDF. Please try again."); })
    .finally(function(){ host.innerHTML = ""; });
}

/* ---- click-to-enlarge for screenshots (fit to screen, then full size) ---- */
function setLightboxZoomLabel(){
  const lb = document.getElementById("lightbox");
  const btn = document.getElementById("lightboxZoomBtn");
  if(btn && lb) btn.textContent = lb.classList.contains("actual") ? "Fit to screen" : "Zoom to full size";
}
function openLightbox(el){
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");
  if(!lb || !img) return;
  img.src = el.currentSrc || el.src;
  lb.classList.remove("actual");
  setLightboxZoomLabel();
  lb.classList.add("open");
  lb.scrollTop = 0; lb.scrollLeft = 0;
}
function toggleLightboxZoom(ev){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  const lb = document.getElementById("lightbox");
  if(!lb) return;
  lb.classList.toggle("actual");
  setLightboxZoomLabel();
  lb.scrollTop = 0; lb.scrollLeft = 0;
}
function openLightboxNewTab(ev){
  if(ev && ev.stopPropagation) ev.stopPropagation();
  const img = document.getElementById("lightboxImg");
  if(!img || !img.src) return;
  const win = window.open("", "_blank");   // open first, so pop-up blockers allow it
  fetch(img.src).then(function(r){ return r.blob(); })
    .then(function(blob){ if(win) win.location.href = URL.createObjectURL(blob); })
    .catch(function(){ if(win) win.close(); });
}
function closeLightbox(){
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightboxImg");
  if(lb){ lb.classList.remove("open"); lb.classList.remove("actual"); }
  if(img) img.removeAttribute("src");
}
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeLightbox(); });

/* ---- init ---- */
(function initFromStorage(){
  const saved = loadProgress();
  if(saved && saved.state){
    state = Object.assign(
      {currentSection:0, unlockedUpTo:1, sectionPassed:{}, quizMode:{}, quizAnswers:{}, quizSubmitted:{}, sectionScore:{}, certName:""},
      saved.state,
      {quizMode:{}} // never resume mid-quiz-taking; land on the section overview instead
    );
  }
})();
renderAll();
if(state.unlockedUpTo > 1 || Object.keys(state.sectionPassed).length > 0){
  showResumeToast();
}
</script>
